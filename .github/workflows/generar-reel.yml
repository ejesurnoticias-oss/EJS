name: Generar Reel EJE SUR

on:
  workflow_dispatch:
    inputs:
      categoria:
        description: 'Categoría (ej: GEOPOLÍTICA)'
        required: true
      subtag:
        description: 'Subtag (ej: MALVINAS)'
        required: true
      titular:
        description: 'Titular completo'
        required: true
      bajada:
        description: 'Bajada/resumen'
        required: true
      busqueda_foto:
        description: 'Término de búsqueda para la foto (en inglés, ej: military coastal)'
        required: true

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Instalar dependencias
        run: pip install pillow requests

      - name: Generar el Reel
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CATEGORIA: ${{ github.event.inputs.categoria }}
          SUBTAG: ${{ github.event.inputs.subtag }}
          TITULAR: ${{ github.event.inputs.titular }}
          BAJADA: ${{ github.event.inputs.bajada }}
          BUSQUEDA_FOTO: ${{ github.event.inputs.busqueda_foto }}
        run: python generate_reel.py

      - name: Subir el video generado
        uses: actions/upload-artifact@v4
        with:
          name: reel-output
          path: output/reel.mp4

      - name: Commitear el resultado al repo (para link público)
        run: |
          git config --global user.name "eje-sur-bot"
          git config --global user.email "bot@ejesur.com"
          git add output/reel.mp4
          git commit -m "Nuevo Reel generado automáticamente" || echo "Sin cambios"
          git push
